name: Build Executables

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macos-26-intel', 'macos-latest']

    env:
      MAIN_PY_FILE: 'app.py'
      APP_NAME: 'Church Phone Line Configurator'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.14.x

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
      working-directory: ./

    - name: Install PyInstaller
      run: |
        pip install pyinstaller
      working-directory: ./

    - name: Build executable
      run: |
        pyinstaller -F -n "${{ env.APP_NAME }}" --add-data "functions:functions" ${{ env.MAIN_PY_FILE }}
      working-directory: ./

    - name: Create Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: dist/

    - name: Create Artifact (macOS Intel)
      if: matrix.os == 'macos-26-intel'
      uses: actions/upload-artifact@v4
      with:
        name: macos-executables-intel
        path: dist/

    - name: Create Artifact (macOS Apple Silicon)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-executables-applesilicon
        path: dist/

    - name: List files in dist folder
      run: ls -R ./dist/
